name: release

# Manual on purpose. Publishing to npm needs an npm account and an NPM_TOKEN
# secret, which this repository does not have yet. Run it from the Actions tab
# when both exist, and tag the release from the same commit.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm test --workspace @keyward/core
      - name: publish cli
        run: npm publish --workspace @keyward/cli --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
